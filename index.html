<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lqh4097 - 个人主页</title>
  <style>
    :root {
      --bg-color: #0c0e14;
      --card-bg: rgba(23, 27, 38, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(99, 102, 241, 0.4);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --tag-bg: rgba(99, 102, 241, 0.12);
      --tag-text: #a5b4fc;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-color: #f8fafc;
        --card-bg: rgba(255, 255, 255, 0.85);
        --card-border: rgba(0, 0, 0, 0.06);
        --card-hover-border: rgba(99, 102, 241, 0.5);
        --text-primary: #111827;
        --text-secondary: #4b5563;
        --accent: #4f46e5;
        --accent-glow: rgba(79, 70, 229, 0.15);
        --tag-bg: rgba(79, 70, 229, 0.08);
        --tag-text: #4f46e5;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      line-height: 1.6;
      background-image: 
        radial-gradient(circle at 20% 20%, var(--accent-glow) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(147, 51, 234, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      padding: 2rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      transition: all 0.25s ease;
    }

    .card:hover {
      border-color: var(--card-hover-border);
    }

    .hero-card {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .badge-status {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8125rem;
      font-weight: 500;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      background: var(--tag-bg);
      color: var(--tag-text);
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.9); }
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .profile-info h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .profile-info p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-top: 0.2rem;
    }

    .bio {
      color: var(--text-secondary);
      font-size: 0.975rem;
      line-height: 1.7;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .tag {
      font-size: 0.8125rem;
      padding: 0.25rem 0.75rem;
      border-radius: 0.5rem;
      background: var(--tag-bg);
      color: var(--tag-text);
    }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.75rem;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1rem;
      border-radius: 0.85rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-primary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }

    .link-item:hover {
      border-color: var(--card-hover-border);
      background: var(--accent);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px var(--accent-glow);
    }

    footer {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.8125rem;
      margin-top: 0.5rem;
    }

    footer a {
      color: var(--text-secondary);
      text-decoration: none;
      border-bottom: 1px dashed var(--text-secondary);
    }

    footer a:hover {
      color: var(--text-primary);
    }
  </style>
</head>
<body>

    <!-- 主卡片 -->
    <div class="card hero-card">
      <div class="badge-status">

      <div class="tags">

        <span class="tag">Open Source</span>

        <span class="tag">Tech & Life</span>

      <p>© 2025 lqh4097 · 基于 <a href="https://pages.cloudflare.com/" target="_blank" rel="noopener noreferrer">Cloudflare Pages</a> 部署</p>
    </footer>
  </div>
</body>
</html>
